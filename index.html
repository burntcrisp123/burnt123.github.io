<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Media Link</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon {
            font-size: 42px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0 0 26px 0;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            transition: transform 0.15s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .reveal-text {
            display: none;
            font-size: 22px;
            font-weight: 800;
            color: #ef4444;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✨</div>
        <h1>Shared Media Portal</h1>
        <p>NFC Card Tap Verified<br>Tap below to view exclusive content</p>

        <button class="btn" id="actionBtn" onclick="openContent()">
            🔓 Tap to View Content
        </button>

        <div class="reveal-text" id="revealMsg">
            🎉 YOU'RE AN IDIOPT! 😂
        </div>
    </div>

    <script>
        let clicked = false;

        function openContent() {
            if (clicked) return;
            clicked = true;

            // 1. Hide Button & Show Prank Message
            document.getElementById('actionBtn').style.display = 'none';
            document.getElementById('revealMsg').style.display = 'block';

            // 2. Trigger Phone Vibration
            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 100, 50, 300, 100, 500]);
            }

            // 3. Robotic Voice Speech
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voiceMsg = new SpeechSynthesisUtterance("Warning. You're an idiot.");
                voiceMsg.rate = 0.9;
                voiceMsg.pitch = 0.7;
                window.speechSynthesis.speak(voiceMsg);
            }

            // 4. Auto-Launch Rickroll Video
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 2500);
        }
    </script>

</body>
</html>
